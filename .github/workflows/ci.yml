name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DSC2OPT_BUILD_TESTS=ON -DSC2OPT_BUILD_BENCHMARKS=ON
          -DSC2OPT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  python-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build-only binding dependency
        run: python -m pip install --disable-pip-version-check pybind11
      - name: Configure Python adapter
        run: >-
          python -c "import pybind11, subprocess;
          subprocess.check_call(['cmake','-S','.','-B','build-python',
          '-DCMAKE_BUILD_TYPE=Release','-DSC2OPT_BUILD_TESTS=ON',
          '-DSC2OPT_BUILD_PYTHON=ON','-DSC2OPT_WARNINGS_AS_ERRORS=ON',
          '-Dpybind11_DIR='+pybind11.get_cmake_dir()])"
      - name: Build Python adapter
        run: cmake --build build-python --config Release
      - name: Test Python adapter
        run: ctest --test-dir build-python -C Release --output-on-failure

  c-abi-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C ABI
        run: >-
          cmake -S . -B build-cabi -DCMAKE_BUILD_TYPE=Release
          -DSC2OPT_BUILD_TESTS=ON -DSC2OPT_BUILD_C_ABI=ON
          -DSC2OPT_WARNINGS_AS_ERRORS=ON
      - name: Build C ABI
        run: cmake --build build-cabi --config Release
      - name: Test C ABI
        run: ctest --test-dir build-cabi -C Release --output-on-failure

  language-edge-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Node development headers
        run: sudo apt-get update && sudo apt-get install -y libnode-dev
      - name: Configure C ABI + Java + Node edges
        run: >-
          cmake -S . -B build-edges -DCMAKE_BUILD_TYPE=Release
          -DSC2OPT_BUILD_TESTS=OFF -DSC2OPT_BUILD_C_ABI=ON
          -DSC2OPT_BUILD_JAVA_JNI=ON -DSC2OPT_BUILD_NODE_NAPI=ON
          -DSC2OPT_NODE_INCLUDE_DIR=/usr/include/node
          -DSC2OPT_WARNINGS_AS_ERRORS=ON
      - name: Build native language edges
        run: cmake --build build-edges --parallel 2
      - name: Compile Java edge
        run: javac -d build-java Adapters/Java/SC2AIOptimize.java
      - name: Check Node loader
        run: node --check Adapters/Node/index.js
      - name: Compile Rust edge
        run: rustc --edition 2021 --crate-type lib Adapters/Rust/sc2opt.rs -o build-rust.rlib
      - name: Compile .NET edge
        run: dotnet build Adapters/DotNet/SC2AIOptimize.csproj -c Release
      - name: Compile and load Go edge
        working-directory: Adapters/Go
        env:
          CGO_CFLAGS: -I${{ github.workspace }}/include
          CGO_LDFLAGS: -L${{ github.workspace }}/build-edges -lsc2opt_c
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-edges
        run: go test ./...

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASAN + UBSAN
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DSC2OPT_BUILD_TESTS=ON -DSC2OPT_WARNINGS_AS_ERRORS=ON
          -DSC2OPT_ENABLE_ASAN=ON -DSC2OPT_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure clang-tidy
        run: >-
          cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Debug
          -DSC2OPT_BUILD_TESTS=OFF -DSC2OPT_WARNINGS_AS_ERRORS=ON
          -DSC2OPT_ENABLE_CLANG_TIDY=ON
      - name: Build with analysis
        run: cmake --build build-tidy --parallel 2

  installed-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure installable Release + LTO
        run: >-
          cmake -S . -B build-install -DCMAKE_BUILD_TYPE=Release
          -DSC2OPT_BUILD_TESTS=OFF -DSC2OPT_WARNINGS_AS_ERRORS=ON
          -DSC2OPT_ENABLE_LTO=ON
      - name: Build
        run: cmake --build build-install --config Release
      - name: Install package
        run: cmake --install build-install --config Release --prefix "${{ github.workspace }}/stage"
      - name: Configure unrelated installed consumer
        run: >-
          cmake -S tests/install_consumer -B build-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"
      - name: Build unrelated installed consumer
        run: cmake --build build-consumer --config Release
      - name: Test unrelated installed consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure

  avx2-compile-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure explicit AVX2 contract
        run: >-
          cmake -S . -B build-avx2 -DCMAKE_BUILD_TYPE=Release
          -DSC2OPT_BUILD_TESTS=OFF -DSC2OPT_WARNINGS_AS_ERRORS=ON
          -DSC2OPT_ENABLE_AVX2=ON
      - name: Compile only
        run: cmake --build build-avx2 --parallel 2